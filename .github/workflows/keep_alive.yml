name: Keep Streamlit Alive

on:
  schedule:
    # Запуск каждые 2 дня в 06:00 UTC (09:00 МСК)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Возможность ручного запуска кнопкой в GitHub Actions

permissions:
  contents: read

jobs:
  wake_up:
    name: Check and Wake Streamlit App
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping and Wake Streamlit
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || 'https://pvjjwzapucy4re6bakgfza.streamlit.app/' }}
        run: |
          python .github/scripts/wake_streamlit.py

      - name: Upload Status Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamlit-status-screenshot
          path: streamlit_status.png
          if-no-files-found: ignore
